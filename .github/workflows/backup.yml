name: Database backup

# Logical pg_dump of the Neon database, encrypted, stored as a downloadable
# 90-day artifact. Runs daily and on demand. Needs two repo secrets:
#   DATABASE_URL_UNPOOLED — the direct Neon URL (Vercel → Settings → Env Vars)
#   BACKUP_PASSPHRASE     — a long random passphrase; keep a copy somewhere safe,
#                           a backup can't be restored without it.
#
# The repo is public, so artifacts are downloadable by any signed-in GitHub
# user: the dump is encrypted (gpg, AES-256) before upload, and the job fails
# rather than upload plaintext if BACKUP_PASSPHRASE is missing.
#
# To restore: download and unzip the artifact, then
#   gpg --decrypt worldcup-YYYYMMDD-HHMMSS.sql.gz.gpg > worldcup-YYYYMMDD-HHMMSS.sql.gz
#   (gpg prompts for BACKUP_PASSPHRASE)
#   npm run db:restore -- worldcup-YYYYMMDD-HHMMSS.sql.gz   # OVERWRITES the target

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          # Put the v17 binaries first on PATH — the runner ships pg_dump 16,
          # which refuses to dump a Postgres 17 server.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt database
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_UNPOOLED:-}" ]; then
            echo "::error::Missing repo secret DATABASE_URL_UNPOOLED — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Fail closed: this repo is public, so never upload a plaintext dump.
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Missing repo secret BACKUP_PASSPHRASE — add it under Settings → Secrets and variables → Actions. Refusing to upload an unencrypted backup."
            exit 1
          fi
          pg_dump --version
          mkdir -p backups
          OUT="backups/worldcup-$(date +%Y%m%d-%H%M%S).sql.gz"
          pg_dump "$DATABASE_URL_UNPOOLED" --no-owner --no-privileges --clean --if-exists | gzip > "$OUT"
          # Guard against a silently-empty dump (e.g. a masked pg_dump error).
          SIZE=$(gzip -dc "$OUT" | wc -c)
          echo "Uncompressed dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Dump is only ${SIZE} bytes — treating as failed."
            exit 1
          fi
          # Encrypt; the passphrase goes in on stdin, never on the command line.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 --passphrase-fd 0 \
            --output "$OUT.gpg" "$OUT"
          rm -f "$OUT"
          ls -lh backups

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql.gz.gpg
          if-no-files-found: error
          retention-days: 90
