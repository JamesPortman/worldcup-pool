name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  test-build:
    name: Test & build
    runs-on: ubuntu-latest
    env:
      # Dummy values — no DB connection happens at build/test time (pages are
      # force-dynamic and the unit tests mock Prisma), but the Prisma client
      # needs these vars present to instantiate.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit & component tests
        run: npm run test
      - name: Type-check & production build
        run: npm run build
